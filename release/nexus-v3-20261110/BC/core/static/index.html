    <script>
      // pre-paint theme: avoid a flash when the user picked a fixed mode
      (function () {
        var pref = "auto";
        try { pref = localStorage.getItem("nexus-theme") || "auto"; } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
